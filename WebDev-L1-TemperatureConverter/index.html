<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tempora - Temperature Converter</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <main class="container">

        <div class="converter-card">

            <div class="header">
                <div class="temperature-icon">°</div>

                <p class="label">SMART TOOL</p>

                <h1>Temperature<br><span>Converter</span></h1>

                <p class="subtitle">
                    Convert temperatures quickly and accurately between
                    Celsius, Fahrenheit, and Kelvin.
                </p>
            </div>


            <div class="form-group">

                <label for="temperature">Temperature</label>

                <input
                    type="text"
                    id="temperature"
                    placeholder="Enter temperature"
                    autocomplete="off"
                >

                <p id="error" class="error"></p>

            </div>


            <div class="form-group">

                <label for="unit">Convert From</label>

                <select id="unit">

                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>

                </select>

            </div>


            <button id="convertBtn">
                Convert Temperature
            </button>


            <div id="results" class="results hidden">

                <div class="result-card">
                    <span>Celsius</span>
                    <strong id="celsiusResult">--</strong>
                </div>

                <div class="result-card">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">--</strong>
                </div>

                <div class="result-card">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">--</strong>
                </div>

            </div>


            <div class="footer-note">
                <span>✓</span>
                Accurate conversion • Absolute zero protected
            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
